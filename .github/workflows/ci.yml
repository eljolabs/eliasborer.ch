name: CI
on:
  push:
    branches: [main, release/github-pages, chore/release-hardening, feat/portfolio-stress-lab, feat/diversification-lab]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base: ['/', '/eliasborer.ch/']
    env:
      SITE_URL: https://eljolabs.github.io
      BASE_PATH: ${{ matrix.base }}
      PUBLIC_HOSTING_PROVIDER: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify:dist
