name: CI
on:
  push:
    branches: [main, release/github-pages, chore/release-hardening, feat/portfolio-stress-lab, feat/diversification-lab]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base: ['/', '/eliasborer.ch/']
    env:
      SITE_URL: https://eljolabs.github.io
      BASE_PATH: ${{ matrix.base }}
      PUBLIC_HOSTING_PROVIDER: github-pages
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify:dist
